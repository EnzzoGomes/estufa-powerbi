name: Enviar para o Power BI

on:
  schedule:
    - cron: "*/15 * * * *"   # a cada 15 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:          # botão "Run workflow" para rodar na hora

permissions:
  contents: write             # para salvar o ultimo_envio.txt

concurrency:
  group: powerbi
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Enviar médias de 15 min
        env:
          POWERBI_PUSH_URL: ${{ secrets.POWERBI_PUSH_URL }}
        run: python3 enviar_powerbi.py

      - name: Salvar até onde foi enviado
        if: always()
        run: |
          if [ -n "$(git status --porcelain ultimo_envio.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ultimo_envio.txt
            git commit -m "Power BI: enviado até $(cat ultimo_envio.txt)"
            git push
          fi
